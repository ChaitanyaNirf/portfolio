<!-- Primary Sidebar -->
<div class="sidebar" [class.hidden]="isCollapsed">
  <div class="sidebar-header-workspace">
    <span>chaitanya&#64;portfolio:~/portfolio$ ls -la</span>
  </div>
  
  <ul [class.hidden]="isFileListHidden">
    <li *ngFor="let tab of allTabs" (click)="openSection(tab)">
      <span *ngIf="tab !== 'None'">
        <span class="file-perms">
          <ng-container *ngIf="tab.toLowerCase() === 'game' || tab.toLowerCase() === 'resume'">-rwxr-xr-x</ng-container>
          <ng-container *ngIf="tab.toLowerCase() !== 'game' && tab.toLowerCase() !== 'resume'">-rw-r--r--</ng-container>
        </span>
        <span class="file-owner">chaitanya chaitanya</span>
        <span class="file-name" [ngClass]="{'executable': tab.toLowerCase() === 'game' || tab.toLowerCase() === 'resume'}">
          {{ getFormattedTabName(tab) }}{{ tab.toLowerCase() === 'game' ? '.sh' : (tab.toLowerCase() === 'resume' ? '.pdf' : '.md') }}
        </span>
      </span>
    </li>
  </ul>
</div>
