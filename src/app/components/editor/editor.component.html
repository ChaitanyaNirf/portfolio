<div class="content">
  @switch (activeTab.toLowerCase()) {
    @case ('resume') {
      <app-resume></app-resume>
    }
    @case ('leetcode') {
      <app-leetcode></app-leetcode>
    }
    @case ('skills') {
      <app-skills></app-skills>
    }
    @case ('github') {
      <app-github></app-github>
    }
    @case ('welcome') {
      <app-welcome (openGame)="onOpenGame()"></app-welcome>
    }
    @case ('experience') {
      <app-experience></app-experience>
    }
    @case ('publications') {
      <app-publications></app-publications>
    }
    @case ('projects') {
      <app-projects></app-projects>
    }
    @case ('contact') {
      <app-contact></app-contact>
    }
    @case ('game') {
      <app-terminal-game></app-terminal-game>
    }
    @default {
      <div [innerHTML]="sanitizedContent"></div>
    }
  }
</div>
