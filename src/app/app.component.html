<!-- Terminal Window Header -->
<header class="vscode-navbar">
  <div class="navbar-left terminal-dots">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
  </div>
  
  <div class="navbar-center" (click)="commandPalette.togglePalette()" (keydown.enter)="commandPalette.togglePalette()" tabindex="0">
    <span class="prompt">$</span>
    <span>./portfolio.sh — Press Ctrl+Shift+P to execute commands</span>
  </div>

  <div class="navbar-right">
    <span class="terminal-user">chaitanya&#64;portfolio:~</span>
  </div>
</header>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" 
     [class.active]="isMobileSidebarOpen" 
     (click)="closeMobileSidebar()"
     (keydown.enter)="closeMobileSidebar()"
     tabindex="0">
</div>

<!-- Main Layout -->
<div class="app-container">
  <app-sidebar 
    [class.sidebar-collapsed]="isSidebarCollapsed"
    [class.sidebar-mobile-open]="isMobileSidebarOpen"
    (sectionSelected)="openSection($event)">
  </app-sidebar>
  
  <div class="editor">
    <app-tabs 
      [openTabs]="openTabs" 
      [activeTab]="activeTab" 
      (tabClosed)="updateOpenTabs($event)"
      (tabChanged)="switchTab($event)">
    </app-tabs>
    
    <app-editor [content]="editorContent" [activeTab]="activeTab" (navigateToGame)="openSection('game')"></app-editor>
  </div>
</div>

<!-- Command Palette -->
<app-command-palette #commandPalette="commandPalette" (commandNavigate)="openSection($event)"></app-command-palette>
